name: WORLD SHARDS - xkcd Quality Tests

on:
  push:
    branches:
      - main
      - "review/xkcd-*"
    paths:
      - "shards_collector_m14.py"
      - "edition_processor.py"
      - "frontend/app.js"
      - "frontend/style.css"
      - "tests/test_xkcd_selection.py"
      - "tests/test_xkcd_quality.py"
      - ".github/workflows/xkcd-quality-tests.yml"
  pull_request:
    branches:
      - main
    paths:
      - "shards_collector_m14.py"
      - "edition_processor.py"
      - "frontend/app.js"
      - "frontend/style.css"
      - "tests/test_xkcd_selection.py"
      - "tests/test_xkcd_quality.py"
      - ".github/workflows/xkcd-quality-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  xkcd-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r requirements.txt
          python -m pip install pytest
      - name: Compile Python modules
        run: python -m compileall -q shards_collector_m14.py edition_processor.py
      - name: Run xkcd quality and no-repeat tests
        run: python -m pytest tests/test_xkcd_selection.py tests/test_xkcd_quality.py -q
      - name: Validate frontend JavaScript syntax
        run: node --check frontend/app.js
