name: WORLD SHARDS - Matrix Error Watchdog

on:
  schedule:
    # Budapest 06:05: UTC 04:05 nyári időszámításkor, 05:05 téli időszámításkor.
    # A helyi időkapu miatt a két UTC triggerből naponta csak az egyik riaszt.
    - cron: "5 4,5 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: world-shards-matrix-watchdog-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  check-daily-edition:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ellenőrzés – publikáció és e-mail ténylegesen megtörtént-e
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import urllib.request
          from datetime import datetime
          from zoneinfo import ZoneInfo

          tz = ZoneInfo("Europe/Budapest")
          now = datetime.now(tz)

          # A cron két UTC időpontot fed le a nyári/téli óraátállítás miatt.
          # Csak a helyi 06:05-ös futás végez ellenőrzést.
          if now.hour != 6:
              print("alert=false")
              print("Nem a 06:05-ös budapesti ellenőrzési időpont; kihagyva.")
              raise SystemExit(0)

          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          api = "https://api.github.com/repos/" + repo

          def get_json(url):
              request = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": "Bearer " + token,
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.loads(response.read().decode("utf-8"))

          runs = get_json(
              api + "/actions/workflows/world-shards-daily.yml/runs"
              "?branch=main&per_page=100"
          ).get("workflow_runs", [])

          todays = []
          for run in runs:
              stamp = run.get("run_started_at") or run.get("created_at")
              if not stamp:
                  continue
              started = datetime.fromisoformat(
                  stamp.replace("Z", "+00:00")
              ).astimezone(tz)
              if started.date() == now.date():
                  todays.append(run)

          todays.sort(
              key=lambda item: (
                  item.get("run_number", 0),
                  item.get("run_attempt", 1),
              ),
              reverse=True,
          )

          delivered_run = None
          latest = todays[0] if todays else None
          failure_name = "A napi automatikus kiadás ma nem indult el"
          run_url = latest.get("html_url", "") if latest else ""

          # Nem csak a legutolsó futást nézzük: egy későbbi idempotens
          # újrapróbálkozás kihagyhatja a publikációt/e-mailt, miközben
          # egy korábbi mai futás már sikeresen kézbesítette a kiadást.
          for run in todays:
              if run.get("status") != "completed" or run.get("conclusion") != "success":
                  continue
              jobs = get_json(run["url"] + "/jobs").get("jobs", [])
              daily = next(
                  (job for job in jobs if job.get("name") == "daily-edition"),
                  None,
              )
              if not daily:
                  continue
              steps = {
                  step.get("name"): step.get("conclusion")
                  for step in daily.get("steps", [])
              }
              if (
                  steps.get("Teljessegi ellenorzes es automatikus publikacio") == "success"
                  and steps.get("Teljes napi kiadás e-mailben") == "success"
              ):
                  delivered_run = run
                  break

          if delivered_run:
              print("alert=false")
              print(
                  "A mai kiadás publikációja és teljes e-mailes küldése sikeres: "
                  + delivered_run.get("html_url", "")
              )
              raise SystemExit(0)

          if latest:
              run_url = latest.get("html_url", "")
              if latest.get("status") in ("queued", "in_progress"):
                  failure_name = (
                      "A napi kiadás 06:05-kor még fut; a reggeli kézbesítési határidő "
                      "nem teljesült"
                  )
              elif latest.get("conclusion") == "success":
                  jobs = get_json(latest["url"] + "/jobs").get("jobs", [])
                  daily = next(
                      (job for job in jobs if job.get("name") == "daily-edition"),
                      None,
                  )
                  if daily:
                      steps = {
                          step.get("name"): step.get("conclusion")
                          for step in daily.get("steps", [])
                      }
                      if steps.get("Teljessegi ellenorzes es automatikus publikacio") != "success":
                          failure_name = "A kiadvány publikációja nem fejeződött be sikeresen"
                      else:
                          failure_name = "A teljes napi kiadás e-mail-küldése nem fejeződött be"
                  else:
                      failure_name = "A napi kiadási feladat nem futott le"
              else:
                  failure_name = (
                      "A napi automatikus futás hibával vagy megszakítással zárult: "
                      + str(latest.get("conclusion") or latest.get("status"))
                  )
                  jobs = get_json(latest["url"] + "/jobs").get("jobs", [])
                  for job in jobs:
                      for step in job.get("steps", []):
                          if step.get("conclusion") in ("failure", "cancelled"):
                              failure_name = step.get("name") or failure_name
                              break
                      if job.get("conclusion") in ("failure", "cancelled"):
                          break

          print("alert=true")
          print("failure_name=" + failure_name.replace("\\n", " "))
          print("run_url=" + run_url)
          print("MATRIX ALERT: " + failure_name)
          PY

      - name: HIBA A MÁTRIXBAN értesítő e-mail küldése
        if: steps.check.outputs.alert == 'true'
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.WORLD_SHARDS_NOTIFY_EMAIL }}
          FAILURE_NAME: ${{ steps.check.outputs.failure_name }}
          RUN_URL: ${{ steps.check.outputs.run_url }}
        run: |
          python - <<'PY'
          import os
          import smtplib
          from datetime import datetime
          from email.message import EmailMessage
          from zoneinfo import ZoneInfo

          sender = os.environ.get("MAIL_USERNAME", "")
          password = os.environ.get("MAIL_PASSWORD", "")
          recipient = os.environ.get("NOTIFY_EMAIL", "")
          missing = [
              name for name, value in (
                  ("MAIL_USERNAME", sender),
                  ("MAIL_PASSWORD", password),
                  ("WORLD_SHARDS_NOTIFY_EMAIL", recipient),
              ) if not value
          ]
          if missing:
              raise RuntimeError("Hiányzó SMTP-beállítás: " + ", ".join(missing))

          today = datetime.now(ZoneInfo("Europe/Budapest")).strftime("%Y-%m-%d")
          issue = os.environ.get("FAILURE_NAME", "Ismeretlen napi futási hiba")
          run_url = os.environ.get("RUN_URL", "")
          message = EmailMessage()
          message["Subject"] = f"HIBA A MÁTRIXBAN! – WORLD SHARDS – {today}"
          message["From"] = sender
          message["To"] = recipient
          body = (
              "HIBA A MÁTRIXBAN!\n\n"
              + issue
              + "\n\nA mai WORLD SHARDS kiadás publikációja és teljes e-mailes "
              "kézbesítése nem igazolható.\n"
          )
          if run_url:
              body += "\nA futás részletei: " + run_url + "\n"
          body += "\nAutomatikus rendszerértesítés – WORLD SHARDS"
          message.set_content(body)

          with smtplib.SMTP_SSL("smtp.gmail.com", 465, timeout=30) as smtp:
              smtp.login(sender, password)
              smtp.send_message(message)

          print("HIBA A MÁTRIXBAN értesítés elküldve.")
          PY
