name: WORLD SHARDS - Matrix Error Watchdog

on:
  schedule:
    # 06:15 Europe/Budapest: 04:15 UTC in summer, 05:15 UTC in winter.
    - cron: "15 4,5 * * *"

permissions:
  actions: read
  contents: read

concurrency:
  group: world-shards-matrix-watchdog
  cancel-in-progress: false

jobs:
  check-daily-edition:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check whether today's edition was delivered
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime
          from zoneinfo import ZoneInfo

          tz = ZoneInfo("Europe/Budapest")
          now = datetime.now(tz)
          if os.getenv("GITHUB_EVENT_NAME") == "schedule" and not (
              now.hour == 6 and now.minute >= 15
          ):
              print("Not the 06:15 Budapest watchdog window; no action.")
              with open(os.environ["GITHUB_OUTPUT"], "a") as out:
                  out.write("alert=false\n")
              raise SystemExit(0)

          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          api = "https://api.github.com/repos/" + repo

          def get_json(url):
              request = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": "Bearer " + token,
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.loads(response.read().decode("utf-8"))

          today = now.date()
          runs = get_json(
              api + "/actions/workflows/world-shards-daily.yml/runs"
              "?branch=main&per_page=30"
          ).get("workflow_runs", [])

          todays = []
          for run in runs:
              stamp = run.get("run_started_at") or run.get("created_at")
              if not stamp:
                  continue
              started = datetime.fromisoformat(stamp.replace("Z", "+00:00")).astimezone(tz)
              if started.date() == today:
                  todays.append(run)

          successful = False
          latest = max(todays, key=lambda item: item.get("run_number", 0), default=None)
          failure_name = None
          run_url = ""

          for run in todays:
              if run.get("status") != "completed" or run.get("conclusion") != "success":
                  continue
              jobs = get_json(run["url"] + "/jobs").get("jobs", [])
              daily = next((job for job in jobs if job.get("name") == "daily-edition"), None)
              if daily and daily.get("status") == "completed" and daily.get("conclusion") == "success":
                  successful = True
                  break

          if successful:
              print("Today's SHARDS daily edition completed successfully.")
              with open(os.environ["GITHUB_OUTPUT"], "a") as out:
                  out.write("alert=false\n")
              raise SystemExit(0)

          if latest:
              run_url = latest.get("html_url", "")
              if latest.get("status") != "completed":
                  failure_name = "A napi SHARDS-futás 06:15-kor még folyamatban volt"
              else:
                  jobs = get_json(latest["url"] + "/jobs").get("jobs", [])
                  failed = []
                  for job in jobs:
                      for step in job.get("steps", []):
                          if step.get("conclusion") == "failure":
                              failed.append(step.get("name") or job.get("name") or "Ismeretlen lépés")
                      if job.get("conclusion") == "failure" and not any(
                          item.get("conclusion") == "failure" for item in job.get("steps", [])
                      ):
                          failed.append(job.get("name") or "Napi kiadási folyamat")
                  failure_name = failed[0] if failed else (
                      "A napi SHARDS-futás hibával vagy megszakítással zárult"
                  )
          else:
              failure_name = "A napi automatikus SHARDS-futás nem indult el"

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("alert=true\n")
              out.write("failure_name=" + failure_name.replace("\n", " ") + "\n")
              out.write("run_url=" + run_url + "\n")
          print("MATRIX ALERT: " + failure_name)
          PY

      - name: Send HIBA A MATRIXBAN email
        if: steps.check.outputs.alert == 'true'
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.WORLD_SHARDS_NOTIFY_EMAIL }}
          FAILURE_NAME: ${{ steps.check.outputs.failure_name }}
          RUN_URL: ${{ steps.check.outputs.run_url }}
        run: |
          python - <<'PY'
          import os
          import smtplib
          from datetime import datetime
          from email.message import EmailMessage
          from zoneinfo import ZoneInfo

          sender = os.environ["MAIL_USERNAME"]
          password = os.environ["MAIL_PASSWORD"]
          recipient = os.environ["NOTIFY_EMAIL"]
          if not sender or not password or not recipient:
              raise RuntimeError(
                  "Hiányzó SMTP-beállítás: MAIL_USERNAME, MAIL_PASSWORD vagy "
                  "WORLD_SHARDS_NOTIFY_EMAIL."
              )

          today = datetime.now(ZoneInfo("Europe/Budapest")).strftime("%Y-%m-%d")
          issue = os.environ.get("FAILURE_NAME", "Ismeretlen napi futási hiba")
          run_url = os.environ.get("RUN_URL", "")
          message = EmailMessage()
          message["Subject"] = f"HIBA A MÁTRIXBAN! – SHARDS – {today}"
          message["From"] = sender
          message["To"] = recipient
          body = (
              "HIBA A MÁTRIXBAN!\n\n"
              f"{issue}\n\n"
              "- ez a hiba akadályozza a mai lapszám megjelenését.\n\n"
              "A SHARDS napi kiadása 06:15-ig nem jutott el sikeres, "
              "befejezett publikációig és e-mail-küldésig.\n"
          )
          if run_url:
              body += "\nA hibás futás részletei: " + run_url + "\n"
          body += "\nAutomatikus rendszerértesítés – WORLD SHARDS"
          message.set_content(body)

          with smtplib.SMTP_SSL("smtp.gmail.com", 465, timeout=30) as smtp:
              smtp.login(sender, password)
              smtp.send_message(message)

          print("HIBA A MATRIXBAN notification sent.")
          PY
