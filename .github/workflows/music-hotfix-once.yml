name: WORLD SHARDS - One-time Music Record Repair

on:
  push:
    paths:
      - ".github/workflows/music-hotfix-once.yml"

permissions:
  contents: read

jobs:
  repair-music:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Repository letoltese
        uses: actions/checkout@v4
      - name: Python beallitasa
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fuggosegek telepitese
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r requirements.txt
      - name: Music Collector regression tests
        run: python -m unittest test_music_collector.py -v
      - name: Invalid daily music record repair
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python music_collector.py
