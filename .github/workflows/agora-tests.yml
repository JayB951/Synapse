name: AGORA – RSS Collector Tests

on:
  push:
    branches: [main]
    paths:
      - "agora_rss_collector.py"
      - "agora_sources.json"
      - "test_agora_rss_collector.py"
      - ".github/workflows/agora-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agora-rss-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Repository checkout
        uses: actions/checkout@v4
      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --no-cache-dir requests
      - name: Validate source registry JSON
        run: python -m json.tool agora_sources.json > /dev/null
      - name: Run offline RSS parser tests
        run: python -m unittest test_agora_rss_collector.py -v
      - name: Python syntax check
        run: python -m py_compile agora_rss_collector.py test_agora_rss_collector.py
