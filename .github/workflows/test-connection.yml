
name: SYNAPSE - Database Connection Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connection-test:
    runs-on: ubuntu-latest

    steps:
      - name: Repository letoltese
        uses: actions/checkout@v4

      - name: Python beallitasa
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python kornyezet ellenorzese
        run: |
          python --version
          python -m pip --version

      - name: Pip frissitese
        run: |
          python -m pip install --upgrade pip

      - name: Fuggosegek telepitese
        run: |
          python -m pip install --no-cache-dir -r requirements.txt

      - name: Telepites ellenorzese
        run: |
          python -m pip show requests
          python -m pip show supabase
          python -c "import requests; print('REQUESTS OK:', requests.__version__)"
          python -c "import supabase; print('SUPABASE OK')"

      - name: Supabase kapcsolat ellenorzese
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python main.py
