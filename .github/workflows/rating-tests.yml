name: WORLD SHARDS – Rating Tests

on:
  push:
    branches: [main]
    paths:
      - "frontend/app.js"
      - "send_edition_email.py"
      - "test_send_edition_email.py"
      - "shards_collector_m14.py"
      - "edition_builder.py"
      - "tests/test_xkcd_selection.py"
      - "supabase/shard_article_ratings.sql"
      - "supabase/functions/email-rating/index.ts"
      - ".github/workflows/rating-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rating-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Repository letoltese
        uses: actions/checkout@v4
      - name: Python beallitasa
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fuggosegek telepitese
        run: python -m pip install --no-cache-dir -r requirements.txt
      - name: E-mail es alairas tesztek
        run: python -m unittest test_send_edition_email.py -v
      - name: xkcd ismétlés elleni regressziós tesztek
        run: python -m unittest discover -s tests -p "test_xkcd_selection.py" -v
      - name: Frontend JavaScript szintaxisellenorzes
        run: node --check frontend/app.js
