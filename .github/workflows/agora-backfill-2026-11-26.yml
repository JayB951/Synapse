name: WORLD SHARDS - AGORA backfill for edition 2026-11-26
# One-time backfill is triggered on integration into main.
# Retry after automatic commentary-length repair was added.
# The generator can repair short or incomplete commentary before the final QA gate.
# Both HTTP and HTTPS source links are accepted when independently published.
# News candidates are filtered for independent publishers before Gemini selection.
# Require two publishers and one accessible article URL, not two unique URLs.
# Expand Gemini's source-verified shortlist to the top 25 candidates.
# Missing internal evidence notes are derived from the historical catalogue.
# Single-source stories remain eligible when a verifiable article URL exists.
# Both AGORA types use the existing allowed 'agora' database code.
# Simple sentences receive a neutral subordinate clause before final QA.
# Unlisted model source titles are replaced with the approved catalogue source.
# Gemini temporary service errors receive five exponential-backoff attempts.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/agora-backfill-2026-11-26.yml"
      - "agora_automation.py"
      - "agora_gemini_engine.py"
      - "agora_world_shards_adapter.py"
      - "edition_builder.py"
      - "edition_processor.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: world-shards-agora-backfill-2026-11-26
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Repository checkout
        uses: actions/checkout@v4
      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r requirements.txt
      - name: Generate and save both AGORA sections
        env:
          EDITION_DATE: "2026-11-26"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
        run: python agora_automation.py --edition-date 2026-11-26
      - name: Add both AGORA sections to edition 26
        id: edition_builder
        env:
          EDITION_DATE: "2026-11-26"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python edition_builder.py
      - name: Process the completed 16-section edition
        env:
          EDITION_DATE: "2026-11-26"
          ALLOW_PUBLISHED_EDITION: "true"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python edition_processor.py
      - name: Publish only if edition 26 is still a draft
        if: success() && steps.edition_builder.outputs.already_published != 'true'
        id: publish
        env:
          EDITION_DATE: "2026-11-26"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python publish_edition.py
