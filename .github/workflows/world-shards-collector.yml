
name: WORLD SHARDS - Content Collector

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect-content:
    runs-on: ubuntu-latest

    steps:
      - name: Repository letoltese
        uses: actions/checkout@v4

      - name: Python beallitasa
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fuggosegek telepitese
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r requirements.txt

      - name: WORLD SHARDS tartalomgyujtes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python shards_collector.py
