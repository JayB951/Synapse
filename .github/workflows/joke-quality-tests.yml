name: WORLD SHARDS - Joke of the Day Quality Tests

on:
  push:
    branches:
      - main
      - "review/joke-*"
    paths:
      - "shards_collector_m14.py"
      - "edition_builder.py"
      - "edition_processor.py"
      - "tests/test_content_quality_regressions.py"
      - ".github/workflows/joke-quality-tests.yml"
  pull_request:
    branches:
      - main
    paths:
      - "shards_collector_m14.py"
      - "edition_builder.py"
      - "edition_processor.py"
      - "tests/test_content_quality_regressions.py"
      - ".github/workflows/joke-quality-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  joke-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r requirements.txt
          python -m pip install pytest

      - name: Compile changed Python modules
        run: python -m compileall -q shards_collector_m14.py edition_builder.py edition_processor.py

      - name: Run content quality regression tests
        run: python -m pytest tests/test_content_quality_regressions.py -q
