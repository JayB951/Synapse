name: WORLD SHARDS - Daily Automatic Edition

on:
  schedule:
    # A local-time gate below makes this 02:00 Europe/Budapest in both DST seasons.
    - cron: "0 0,1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: world-shards-daily-edition
  cancel-in-progress: false

jobs:
  schedule-gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - name: Run only at 02:00 Budapest local time
        id: gate
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo("Europe/Budapest"))
          print(f"run={'true' if now.hour == 2 else 'false'}")
          PY

  daily-edition:
    needs: schedule-gate
    if: github.event_name == 'workflow_dispatch' || needs.schedule-gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Repository letoltese
        uses: actions/checkout@v4

      - name: Python beallitasa
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fuggosegek telepitese
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r requirements.txt

      - name: Alap tartalmak gyujtese
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python shards_collector.py

      - name: M1.3 rovatok gyujtese
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python shards_collector_m13.py

      - name: M1.4 Unsolved es Closing gyujtes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python shards_collector_m14.py

      - name: Music of the Day gyujtese es tesztek
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python -m unittest test_music_collector.py -v
          python music_collector.py

      - name: AGORA magyar es nemzetkozi tartalom teljes automatizalasa
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
        run: python agora_automation.py

      - name: Napi kiadas osszeallitasa
        id: edition_builder
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python edition_builder.py

      - name: Magyar tartalomfeldolgozas
        if: steps.edition_builder.outputs.already_published != 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python edition_processor.py

      - name: SMTP hitelesites ellenorzese publikacio elott
        if: steps.edition_builder.outputs.already_published != 'true'
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.WORLD_SHARDS_NOTIFY_EMAIL }}
        run: |
          python - <<'PY'
          import os
          import smtplib

          sender = os.getenv("MAIL_USERNAME")
          password = os.getenv("MAIL_PASSWORD")
          recipient = os.getenv("NOTIFY_EMAIL")
          missing = [
              name for name, value in (
                  ("MAIL_USERNAME", sender),
                  ("MAIL_PASSWORD", password),
                  ("WORLD_SHARDS_NOTIFY_EMAIL", recipient),
              )
              if not value
          ]
          if missing:
              raise RuntimeError("Hiányzó e-mail beállítás: " + ", ".join(missing))

          with smtplib.SMTP_SSL("smtp.gmail.com", 465, timeout=30) as smtp:
              smtp.login(sender, password)

          print("SMTP-hitelesítés sikeres; a kiadás publikálható és küldhető.")
          PY

      - name: Teljessegi ellenorzes es automatikus publikacio
        id: publish
        if: steps.edition_builder.outputs.already_published != 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python publish_edition.py

      - name: Teljes napi kiadás e-mailben
        if: success() && steps.publish.outputs.published == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.WORLD_SHARDS_NOTIFY_EMAIL }}
        run: |
          python -m unittest test_send_edition_email.py -v
          python send_edition_email.py
