name: WORLD SHARDS - Daily Automatic Edition

on:
  schedule:
    # Több óránkénti próbálkozás ad tartalékot: a napi első érdemi futás
    # 02:00 Budapest körül indul, a későbbi próbák a reggeli 06:00-s határidő előtt segítenek helyreállni.
    - cron: "0 0,1,2,3 * * *"
  workflow_dispatch:
  # Recovery trigger: a change to this workflow automatically starts today's edition.
  push:
    branches:
      - main
    paths:
      - ".github/workflows/world-shards-daily.yml"
      - "music_collector.py"
      - "test_music_collector.py"
      - "shards_collector_m14.py"
      - "edition_builder.py"

permissions:
  contents: read
  actions: read

concurrency:
  group: world-shards-daily-edition
  cancel-in-progress: false

jobs:
  schedule-gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - name: Run from 02:00 Budapest local time; retry delayed attempts
        id: gate
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo("Europe/Budapest"))
          # GitHub scheduled runs can be delayed by several hours. Do not require an exact hour:
          # the edition builder is idempotent and skips an already-published date.
          # The UTC schedule spans both DST offsets and retries hourly.
          # Repeated runs are safe because edition_builder is idempotent.
          print(f"run={'true' if now.hour >= 2 else 'false'}")
          PY

  daily-edition:
    needs: schedule-gate
    if: github.event_name == 'workflow_dispatch' || needs.schedule-gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Repository letoltese
        uses: actions/checkout@v4

      - name: Python beallitasa
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Korabbi napi archívum es kezbesitesi allapot visszaallitasa
        id: restore
        env:
          GH_TOKEN: ${{ github.token }}
          WORLD_SHARDS_ARCHIVE_DIR: world-shards-archive
        run: python restore_edition_archive.py

      - name: Fuggosegek telepitese
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r requirements.txt

      - name: Korabbi SQLite tartalmak visszaszinkronizalasa
        if: steps.restore.outputs.sqlite_found == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python sync_fallback_store.py

      - name: Alap tartalmak gyujtese
        if: steps.restore.outputs.archive_found != 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python shards_collector.py

      - name: M1.3 rovatok gyujtese
        if: steps.restore.outputs.archive_found != 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python shards_collector_m13.py

      - name: M1.4 Unsolved es Closing gyujtes
        if: steps.restore.outputs.archive_found != 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python shards_collector_m14.py

      - name: Music of the Day gyujtese es tesztek
        if: steps.restore.outputs.archive_found != 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python -m unittest test_music_collector.py -v
          python music_collector.py

      - name: AGORA magyar es nemzetkozi tartalom teljes automatizalasa
        if: steps.restore.outputs.archive_found != 'true'
        timeout-minutes: 12
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
        run: python agora_automation.py

      - name: Napi kiadas osszeallitasa
        if: steps.restore.outputs.archive_found != 'true'
        id: edition_builder
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python edition_builder.py

      - name: Magyar tartalomfeldolgozas
        if: steps.restore.outputs.archive_found != 'true' && steps.edition_builder.outputs.already_published != 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python edition_processor.py

      - name: Teljessegi ellenorzes es automatikus publikacio
        id: publish
        if: steps.restore.outputs.archive_found != 'true' && steps.edition_builder.outputs.already_published != 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python publish_edition.py

      - name: Teljes napi kiadás e-mailben
        if: success() && (steps.restore.outputs.archive_found == 'true' || steps.publish.outputs.archive_ready == 'true') && steps.restore.outputs.delivery_sent != 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.WORLD_SHARDS_NOTIFY_EMAIL }}
          WORLD_SHARDS_ARCHIVE_DIR: world-shards-archive
        run: |
          python -m unittest test_send_edition_email.py -v
          python send_edition_email.py

      - name: Napi tartalék-adattár es archívum megőrzése
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-shards-edition-${{ github.run_id }}
          path: |
            world-shards-archive/
            world-shards-fallback.sqlite3
          if-no-files-found: ignore
          retention-days: 90
