name: WORLD SHARDS - Daily Automatic Edition

on:
  schedule:
    # 01:30 UTC = 02:30 Budapest winter time / 03:30 summer time
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: world-shards-daily-edition
  cancel-in-progress: false

jobs:
  daily-edition:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Repository letoltese
        uses: actions/checkout@v4

      - name: Python beallitasa
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fuggosegek telepitese
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r requirements.txt

      - name: Alap tartalmak gyujtese
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python shards_collector.py

      - name: M1.3 rovatok gyujtese
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python shards_collector_m13.py

      - name: M1.4 Unsolved es Closing gyujtes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python shards_collector_m14.py

      - name: Music of the Day gyujtese es tesztek
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python -m unittest test_music_collector.py -v
          python music_collector.py

      - name: Napi kiadas osszeallitasa
        id: edition_builder
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python edition_builder.py

      - name: Magyar tartalomfeldolgozas
        if: steps.edition_builder.outputs.already_published != 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python edition_processor.py

      - name: Teljessegi ellenorzes es automatikus publikacio
        id: publish
        if: steps.edition_builder.outputs.already_published != 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python publish_edition.py

      - name: Teljes napi kiadás e-mailben
        if: success() && steps.publish.outputs.published == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.WORLD_SHARDS_NOTIFY_EMAIL }}
        run: |
          python -m unittest test_send_edition_email.py -v
          python send_edition_email.py
