name: WORLD SHARDS - Daily Automatic Edition

on:
  schedule:
    # 01:30 UTC = 02:30 Budapest winter time / 03:30 summer time
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: world-shards-daily-edition
  cancel-in-progress: false

jobs:
  daily-edition:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Repository letoltese
        uses: actions/checkout@v4

      - name: Python beallitasa
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fuggosegek telepitese
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r requirements.txt

      - name: Alap tartalmak gyujtese
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python shards_collector.py

      - name: M1.3 rovatok gyujtese
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python shards_collector_m13.py

      - name: M1.4 Unsolved es Closing gyujtes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python shards_collector_m14.py

      - name: Music of the Day gyujtese es tesztek
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python -m unittest test_music_collector.py -v
          python music_collector.py

      - name: Napi kiadas osszeallitasa
        id: edition_builder
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python edition_builder.py

      - name: Magyar tartalomfeldolgozas
        if: steps.edition_builder.outputs.already_published != 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python edition_processor.py

      - name: Teljessegi ellenorzes es automatikus publikacio
        id: publish
        if: steps.edition_builder.outputs.already_published != 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python publish_edition.py

      - name: Ertesito e-mail kuldese sikeres publikacio utan
        if: success() && steps.publish.outputs.published == 'true'
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.WORLD_SHARDS_NOTIFY_EMAIL }}
        run: |
          if [ -z "$MAIL_USERNAME" ] || [ -z "$MAIL_PASSWORD" ] || [ -z "$NOTIFY_EMAIL" ]; then
            echo "E-mail értesítés kihagyva: a Gmail Secrets értékei még nincsenek beállítva."
            exit 0
          fi

          python - <<'PY'
          import os
          import smtplib
          from datetime import datetime
          from email.message import EmailMessage
          from zoneinfo import ZoneInfo

          sender = os.environ["MAIL_USERNAME"]
          password = os.environ["MAIL_PASSWORD"]
          recipient = os.environ["NOTIFY_EMAIL"]

          now = datetime.now(ZoneInfo("Europe/Budapest"))
          date_label = now.strftime("%Y. %m. %d.")
          msg = EmailMessage()
          msg["Subject"] = f"WORLD SHARDS – elkészült a napi kiadás ({date_label})"
          msg["From"] = sender
          msg["To"] = recipient
          msg.set_content(
              f"Elkészült és sikeresen publikálásra került a WORLD SHARDS mai kiadása ({date_label}).\n\n"
              "A magazin itt olvasható:\n"
              "https://jayb951.github.io/Synapse/\n\n"
              "Ez automatikus értesítés; csak sikeres publikálás után küldjük."
          )

          with smtplib.SMTP_SSL("smtp.gmail.com", 465, timeout=30) as smtp:
              smtp.login(sender, password)
              smtp.send_message(msg)

          print(f"Értesítő e-mail sikeresen elküldve: {recipient}")
          PY
