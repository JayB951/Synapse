name: AGORA feed validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-feeds:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependency
        run: python -m pip install requests
      - name: Validate candidate feeds
        run: python agora_feed_validation.py
